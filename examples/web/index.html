<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Groonga on a Web browser</title>
  </head>
  <body>
    <h1>Groonga on a Web browser</h1>
    <p>
      This downloads a file of a Groonga database by HTTP when it's used at
      first, puts it into an in-memory file system and runs commands by
      libgroonga.wasm.
    </p>
    <p id="status">Loading...</p>
    <form id="form">
      <input id="command" size="80" value="status" />
      <button type="submit">Send</button>
    </form>
    <pre id="output"></pre>
    <script type="module" src="./index.mjs"></script>
  </body>
</html>
